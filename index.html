<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE STUDIO — Finanzas personales</title>
<link rel="icon" type="image/png" href="logo-as.png">

<style>
:root{
  --bg:#f5f7fb;
  --panel:#fff;
  --text:#101522;
  --muted:#697386;
  --line:#e5e9f1;
  --accent:#635bff;
  --accent2:#8b5cf6;
  --good:#149447;
  --bad:#d33b50;
  --shadow:0 12px 35px #17255412
}

[data-theme=dark]{
  --bg:#0b0e15;
  --panel:#121722;
  --text:#f5f7fb;
  --muted:#9aa5b5;
  --line:#252d3c;
  --shadow:0 12px 35px #0008
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 80% -10%,#8b5cf61a,transparent 35%),var(--bg);
  color:var(--text);
  font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{display:flex;min-height:100vh}

.side{
  width:245px;
  padding:22px 16px;
  border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  position:sticky;
  top:0;
  height:100vh
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.08em;
  margin:4px 10px 25px
}

.brand span{color:var(--accent)}

nav button{
  width:100%;
  padding:12px 13px;
  margin:3px 0;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  text-align:left
}

nav button.active,
nav button:hover{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  color:var(--text)
}

.main{
  flex:1;
  padding:26px;
  max-width:1500px;
  margin:auto;
  width:100%
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}

.top h1{
  margin:0;
  font-size:28px
}

.actions{
  display:flex;
  gap:8px
}

.btn{
  padding:10px 14px;
  border-radius:11px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text)
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:0;
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow)
}

.label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em
}

.value{
  font-size:27px;
  font-weight:850;
  margin-top:8px;
  letter-spacing:-.02em
}

.card[onclick]:hover .value{
  transform:translateY(-1px)
}

.sub{
  color:var(--muted);
  font-size:12px;
  margin-top:5px
}

.two{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:14px;
  margin-top:14px
}

.section{margin-top:20px}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.field input,
.field select,
.field textarea{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  outline:none
}

.tablewrap{overflow:auto}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  padding:12px 9px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap
}

.table th{
  color:var(--muted);
  font-size:12px
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted)
}

.pill{
  padding:5px 8px;
  border-radius:99px;
  background:#635bff18;
  color:var(--accent);
  font-weight:700;
  font-size:11px
}

.danger{color:var(--bad)}
.good{color:var(--good)}

.progress{
  height:8px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-top:10px
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2))
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10
}

.modal.open{display:flex}

.modalbox{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border-radius:20px;
  padding:20px
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.full{grid-column:1/-1}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px
}

.modalhead h2{margin:0}

.chart{
  height:230px;
  position:relative
}

.chart svg{
  width:100%;
  height:100%
}

.legend{
  display:flex;
  gap:15px;
  color:var(--muted);
  font-size:12px
}

.fab{
  position:fixed;
  right:24px;
  bottom:24px;
  border-radius:99px;
  padding:14px 18px;
  box-shadow:var(--shadow)
}

.chat{
  display:grid;
  grid-template-rows:1fr auto;
  height:calc(100vh - 140px);
  max-width:850px
}

.messages{
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:8px
}

.msg{
  max-width:80%;
  padding:12px 14px;
  border-radius:15px;
  background:var(--line);
  white-space:pre-wrap;
  line-height:1.5
}

.msg.me{
  align-self:flex-end;
  background:var(--accent);
  color:white
}

.chatbar{
  display:flex;
  gap:8px;
  margin-top:10px
}

.chatbar input{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text)
}

.settings{max-width:700px}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  display:none;
  z-index:30
}

.toast.show{display:block}

   ========================================================= */

.ai-layout{

.ai-sidebar{

.ai-sidebar-head{

.ai-sidebar-title{
  font-size:13px;
  font-weight:850;

}

.ai-new{
  width:100%
}

.ai-history{
  overflow:auto;
  padding:8px
}

.ai-conversation{
  width:100%;
  text-align:left;
  padding:11px;
  border-radius:11px;
  background:transparent;
  color:var(--text);

.ai-conversation:hover{

.ai-conversation.active{
  background:color-mix(in srgb,var(--accent) 12%,transparent);

}

.ai-conversation-title{
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.ai-conversation-row{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0
}

.ai-conversation-title{
  flex:1;
  min-width:0;
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.ai-conversation-edit{
  flex:0 0 auto;
  width:25px;
  height:25px;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  opacity:.65;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  cursor:pointer;
  transition:.15s
}
.ai-conversation-row{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0
}

.ai-conversation-title{
  flex:1;
  min-width:0;
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.ai-conversation-edit{
  flex:0 0 auto;
  width:25px;
  height:25px;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  opacity:.65;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  cursor:pointer;
  transition:.15s
}

.ai-conversation-edit:hover{
  opacity:1;
  background:color-mix(
    in srgb,
    var(--accent) 12%,
    transparent
  );
  color:var(--accent)
}
.ai-conversation-edit:hover{
  opacity:1;
  background:color-mix(
    in srgb,
    var(--accent) 12%,
    transparent
  );
  color:var(--accent)
}
.ai-conversation-date{
  color:var(--muted);
  font-size:10px;
  margin-top:4px
}

.ai-main{
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden
}


.ai-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 16px;
  border-bottom:1px solid var(--line)
}

.ai-head-title{
  font-weight:850;
  font-size:15px
}

.ai-head-actions{
  display:flex;
  gap:7px;
  align-items:center
}

.ai-messages{
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:20px
}

.ai-message{
  max-width:min(780px,82%);
  padding:13px 15px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word
}

.ai-message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff
}

.ai-message.assistant{
  align-self:flex-start;
  background:var(--line);
  color:var(--text)
}

.ai-message-name{
  font-size:10px;
  font-weight:850;
  opacity:.7;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.05em
}

.ai-input{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  padding:12px 13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  outline:none
}

.ai-input-row{
  display:flex;
  gap:8px;
  align-items:flex-end
}

.ai-input{
  flex:1;
  min-height:46px;
  max-height:150px;
  resize:none;
  padding:12px 13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  outline:none
}

.ai-send{
  min-width:90px
}

.ai-status{
  font-size:11px;
  color:var(--muted);
  padding:5px 3px 0
}

.ai-empty{
  margin:auto;
  max-width:500px;
  text-align:center;
  color:var(--muted);
  padding:30px
}

.ai-empty-title{
  color:var(--text);
  font-size:20px;
  font-weight:850;
  margin-bottom:8px
}

.ai-typing{
  opacity:.65
}

.ai-delete{
  color:var(--bad)
}

@media(max-width:900px){
  .side{
    width:72px;
    padding:18px 8px
  }

  .brand{font-size:0}
  .brand span{font-size:22px}

  .side nav button{
    font-size:0;
    text-align:center
  }

  .side nav button::first-letter{
    font-size:18px
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .two{
    grid-template-columns:1fr
  }

  .ai-layout{
    grid-template-columns:1fr;
    height:auto
  }

  .ai-sidebar{
    max-height:230px
  }

  .ai-main{
    min-height:600px
  }
}

@media(max-width:600px){
  .side{
    position:fixed;
    z-index:8;
    bottom:0;
    top:auto;
    width:100%;
    height:auto;
    border-right:0;
    border-top:1px solid var(--line);
    padding:5px
  }

  .brand{display:none}

  nav{
    display:flex;
    overflow:auto
  }

  nav button{
    min-width:74px;
    text-align:center;
    padding:9px 5px;
    font-size:10px!important
  }

  .main{
    padding:18px 14px 85px
  }

  .grid{
    grid-template-columns:1fr 1fr
  }

  .value{font-size:21px}

  .formgrid{
    grid-template-columns:1fr
  }

  .full{grid-column:auto}

  .top h1{font-size:23px}

  .actions .hide-mobile{display:none}

  .ai-sidebar{
    max-height:210px
  }

  .ai-main{
    min-height:620px
  }

  .ai-message{
    max-width:90%
  }

  .ai-send{
    min-width:70px
  }
}

.authgate{
  position:fixed;
  inset:0;
  z-index:100;
  background:radial-gradient(circle at 80% -10%,#8b5cf633,transparent 35%),var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.authcard{
  width:min(460px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:0 25px 80px #0003
}

.authbrand{
  font-size:28px;
  font-weight:950;
  letter-spacing:.08em
}

.authbrand span{color:var(--accent)}

.authsub{
  color:var(--muted);
  line-height:1.5;
  margin:8px 0 22px
}

.authtabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:14px
}

.authtabs button{
  padding:9px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:10px
}

.authtabs button.active{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  color:var(--text);
  font-weight:800
}

.authproviders{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0
}

.authbtn{
  width:100%;
  padding:11px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  font-weight:750
}

.authbtn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:0
}

.authdivider{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  margin:14px 0
}

.authdivider:before,
.authdivider:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1
}

.autherror{
  color:var(--bad);
  background:#d33b5012;
  border:1px solid #d33b5030;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  display:none
}

.authfoot{
  font-size:11px;
  color:var(--muted);
  margin-top:15px
}

.profilechip{

  align-items:center;
  gap:8px
}

.profilechip button{
  font-size:11px;
  padding:7px 9px
}

.authhide{display:none!important}
</style>

<script>

const SUPABASE_URL="https://aqrbpwjvsymhcrwwepjm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY="sb_publishable_yw7_LklXOjEuuz9lEGJF6w_T7yV5ATw";

const AUTH_READY=
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_") &&
  SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");

const sb=
  AUTH_READY
  ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    )
  : null;

let session=null;
let currentUser=null;

/* =========================================================
   ALE AI — ESTADO DE CONVERSACIONES
   ========================================================= */

let aiConversationId=null;
let aiConversations=[];
let aiMessages=[];
let aiLoading=false;
let aiInitialized=false;

const BASE_STATE={
  movements:[],
  accounts:[],
  budgets:[],
  goals:[],
  settings:{
  theme:"light",
  contrast:false,
  currency:"USD",
  notifications:true,
  language:"es"
},
  dashboard:{
    period:"all",
    cards:{
      wealth:{
        title:"Patrimonio Líquido",
        desc:"Capital = Disponible"
      },
      capital:{
        title:"Capital",
        desc:"Indicador principal"
      },
      outflow:{
        title:"Flujo de Salida",
        desc:"Gastos acumulados"
      },
      income:{
        title:"Ingresos",
        desc:"Ingresos registrados"
      }
    }
  }
};

let state=structuredClone(BASE_STATE);

const defaultDash={
  wealth:{
    title:"Patrimonio Líquido",
    desc:"Capital = Disponible"
  },
  capital:{
    title:"Capital",
    desc:"Indicador principal"
  },
  outflow:{
    title:"Flujo de Salida",
    desc:"Gastos acumulados"
  },
  income:{
    title:"Ingresos",
    desc:"Ingresos registrados"
  }
};

for(const k in defaultDash){
  state.dashboard.cards[k]=Object.assign(
    {},
    defaultDash[k],
    state.dashboard.cards[k]||{}
  );
}

let page=location.hash.slice(1)||"dashboard";
let editing=null;

const $=s=>document.querySelector(s);

const money=n=>
  new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:state.settings.currency||"USD"
    }
  ).format(Number(n)||0);

const esc=s=>
  String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

function escAuth(v){
  return String(v??"").replace(
    /[&<>"]/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[m])
  )
}

/* =========================================================
   AUTENTICACIÓN
   ========================================================= */

function authUI(tab="email",msg=""){
  const gate=$("#authgate");

  gate.innerHTML=`
  <div class="authcard">

    <div class="authbrand">
      ALE <span>STUDIO</span>
    </div>

    <div class="authsub">
      Tu espacio financiero es privado.
      Inicia sesión para acceder a Dashboard,
      Movimientos, Presupuestos, Metas, Cuentas,
      Patrimonio, Historial y ALE AI.
    </div>

    <div class="autherror" id="autherror"
      style="display:${msg?"block":"none"}">
      ${escAuth(msg)}
    </div>

    <div class="authproviders">
      <button class="authbtn" onclick="oauth('google')">
        G Continuar con Google
      </button>

      <button class="authbtn" onclick="oauth('apple')">
         Continuar con Apple
      </button>
    </div>

    <div class="authdivider">
      o continúa con tu cuenta
    </div>

    <div class="authtabs">
      <button
        class="${tab==='email'?'active':''}"
        onclick="authUI('email')">
        Correo
      </button>

      <button
        class="${tab==='username'?'active':''}"
        onclick="authUI('username')">
        Usuario
      </button>

      <button
        class="${tab==='phone'?'active':''}"
        onclick="authUI('phone')">
        Teléfono
      </button>
    </div>

    ${
      tab==='phone'
      ?
      `
      <form
        onsubmit="phoneLogin(event)"

      mode

    ? f.identity

  await onSignedIn(data.session);
}

async function signup(e,mode){
  e.preventDefault();

  if(!AUTH_READY)
    return authError(
      "La autenticación segura todavía no está conectada. Configura Supabase antes de publicar la app.",
      mode
    );

  const f=Object.fromEntries(new FormData(e.target));

  const email=
    mode==='email'
    ? f.email
    : `${f.username.toLowerCase()}@username.ale-studio.local`;

  const {data,error}=
    await sb.auth.signUp({
      email,
      password:f.password,
      options:{
        data:{
          name:f.name,
          username:mode==='username'?f.username:null
        }
      }
    });

  if(error)
    return authError(error.message,mode);

  if(data.session)
    return onSignedIn(data.session);

  authError(
    "Cuenta creada. Confirma la cuenta si tu proyecto exige verificación y luego inicia sesión.",
    mode
  )
}

async function onSignedIn(s){

  session=s;
  currentUser=s.user;

  await loadWorkspace();

  $("#authgate").classList.add("authhide");

  render();

async function loadWorkspace(){

  state=structuredClone(BASE_STATE);

  if(sb&&currentUser){

    const {data,error}=
      await sb
        .from("workspaces")
        .select("data")
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(error){
      toast(
        "No se pudo cargar tu workspace: "+
        error.message
      );
      return
    }

    if(data?.data)
      state=Object.assign(
        structuredClone(BASE_STATE),
        data.data
      );

    state.dashboard=
      Object.assign(
        structuredClone(BASE_STATE.dashboard),
        state.dashboard||{}
      );

    state.dashboard.cards=
      Object.assign(
        structuredClone(BASE_STATE.dashboard.cards),
        state.dashboard.cards||{}
      );
  }
}

async function logout(){

  if(sb)
    await sb.auth.signOut();

  session=null;
  currentUser=null;

  state=structuredClone(BASE_STATE);

  aiConversationId=null;
  aiConversations=[];
  aiMessages=[];
  aiInitialized=false;

  page="dashboard";
  location.hash="dashboard";

  $("#authgate").classList.remove("authhide");

  authUI()
}

async function bootAuth(){

  if(!AUTH_READY){
    authUI();
    return
  }

  const {data}=await sb.auth.getSession();

  if(data.session)
    await onSignedIn(data.session);
  else
    authUI();

  sb.auth.onAuthStateChange(
    async(_event,s)=>{
      if(s&&!currentUser)
        await onSignedIn(s)
    }
  )
}

function recalculateFinancials(){
  const t=totals();

  return {
    capital:t.balance,
    patrimonioLiquido:t.balance,
    disponible:t.balance,
    flujoSalida:t.expense,
    ingresos:t.income
  };
}

async function save(){

  if(!currentUser)
    return;

  if(sb){

    const {error}=
      await sb
        .from("workspaces")
        .upsert(
          {
            user_id:currentUser.id,
            data:state,
            updated_at:new Date().toISOString()
          },
          {
            onConflict:"user_id"
          }
        );

    if(error){
      toast(
        "No se pudo guardar: "+
        error.message
      );
      return
    }
  }

  render()
}

function totals(){

  let income=0;
  let expense=0;

  state.movements.forEach(m=>{

    if(m.type==="income")
      income+=+m.amount;

    else if(m.type==="expense")
      expense+=+m.amount;

  });

  return{
    income,
    expense,
    balance:income-expense
  }
}

function saveFinancialDigit(e,key){

  e.preventDefault();

  let f=Object.fromEntries(
    new FormData(e.target)
  );

  let amount=+f.amount;

  if(!Number.isFinite(amount)||amount<0)
    return toast("Importe inválido");

  let t=totals();

  let current=
    key==="wealth"||key==="capital"
    ? t.balance
    : key==="outflow"
      ? t.expense
      : t.income;

  let delta=amount-current;

  if(Math.abs(delta)<0.005){
    closeModal();
    toast("El valor ya está actualizado");
    return
  }

  let movement={
    id:crypto.randomUUID(),
    type:delta>=0?"income":"expense",
    amount:Math.abs(delta),
    date:f.date,
    time:"",
    category:
      key==="outflow"
      ?"Ajuste de gastos"
      :"Ajuste de capital",
    sub:"",
    description:f.description,
    account:"",
    method:"Ajuste Dashboard",
    tags:"",
    notes:
      "Cambio realizado desde el valor numérico del Dashboard."
  };

  state.movements.push(movement);

  closeModal();

  save();

  toast("Valor actualizado y guardado");
}

function topCategory(ms=state.movements){

  let x={};

  ms
    .filter(m=>m.type==="expense")
    .forEach(
      m=>x[m.category]=(x[m.category]||0)+ +m.amount
    );

  let k=
    Object.keys(x)
      .sort((a,b)=>x[b]-x[a])[0];

  return k||"—"
}

function lineChart(input){

  let ms=
    (input||state.movements)
      .slice()
      .sort((a,b)=>a.date.localeCompare(b.date));

  if(!ms.length)
    return `<div class="empty">
      Aún no hay datos para mostrar.
    </div>`;

  let bal=0;
  let pts=[];

  ms.forEach(m=>{
    if(m.type==="income")
      bal+=+m.amount;

    if(m.type==="expense")
      bal-=+m.amount;

    pts.push(bal)
  });

  let max=Math.max(...pts,0);
  let min=Math.min(...pts,0);
  let range=max-min||1;

  let p=
    pts.map(
      (v,i)=>
        `${(
          i/
          Math.max(pts.length-1,1)*
          96+
          2
        ).toFixed(1)},${
          (
            94-
            (v-min)/range*82
          ).toFixed(1)
        }`
    ).join(" ");

  return `
  <svg
    viewBox="0 0 100 100"
    preserveAspectRatio="none">

    <polyline
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      points="${p}"/>

    <line
      x1="2"
      y1="94"
      x2="98"
      y2="94"
      stroke="currentColor"
      opacity=".15"/>

  </svg>`
}

function barChart(i,e){

  let mx=Math.max(i,e)||1;

    <rect
      x="20"
      y="${95-i/mx*80}"
      width="22"
      height="${i/mx*80}"
      rx="3"
      fill="currentColor"
      opacity=".75"/>

    <rect
      x="58"
      y="${95-e/mx*80}"
      width="22"
      height="${e/mx*80}"
      rx="3"
      fill="currentColor"
      opacity=".35"/>

    <text
      x="22"
      y="99"
      font-size="6">
      Ingresos
    </text>

    <text
      x="60"
      y="99"
      font-size="6">
      Gastos
    </text>

  </svg>`
}

let calc="";

function calculator(){

  return header("Calculadora científica")
  +

        border-radius:12px;
        background:var(--bg);
        color:var(--text)">

      ${
        [
          "7","8","9","/",
          "sqrt(","4","5","6",
          "*","^","1","2","3",
          "-","(","0",".",")",
          "+","%","sin(","cos(",
          "tan(","log(","ln(","π",
          "e","!","⌫","="
        ]
        .map(
          x=>
            `<button
              class="btn"
              onclick="key('${x}')">
              ${x}
            </button>`
        )
        .join("")
      }

    </div>

    <div class="sub">
      Parser seguro: solo acepta números,
      operadores y funciones matemáticas permitidas.
    </div>

  </div>`

function key(k){

  if(k==="="){

    try{
      calc=String(
        safeEval(calc)
      )
    }catch{
      toast("Expresión no válida")
    }

  }else if(k==="⌫"){

    calc=calc.slice(0,-1)

  }else{

    calc+=k
  }

  render()
}

function safeEval(s){

  s=
    s
      .replaceAll("π","PI")
      .replaceAll("^","**")
      .replace(/\be\b/g,"E");

  if(
    !/^[0-9+\-*/().,%\sA-Za-z_*!]+$/.test(s)
  )
    throw Error();

  let f=
    s
      .replace(/sqrt/g,"Math.sqrt")
      .replace(/sin/g,"Math.sin")
      .replace(/cos/g,"Math.cos")
      .replace(/tan/g,"Math.tan")
      .replace(/log/g,"Math.log10")
      .replace(/ln/g,"Math.log")
      .replace(/\bPI\b/g,"Math.PI")
      .replace(/\bE\b/g,"Math.E");

  if(
    !/^(?:[0-9+\-*/().,%\s]|Math\.(?:sqrt|sin|cos|tan|log10|log|PI|E)|Math\.)+$/.test(f)
  )
    throw Error();

  if(
    /Math\.(?!sqrt|sin|cos|tan|log10|log|PI|E)/.test(f)
  )
    throw Error();

  return Function(
    '"use strict";return ('+
    f+
    ')'
  )()
}

async function initAI(){

  if(
    page!=="ai"||
    !currentUser||
    !sb||
    aiLoading
  )
    return;

  if(aiInitialized)
    return;

  aiLoading=true;

  try{

    await loadAIConversations();

    aiInitialized=true;

  }catch(error){

    console.error("ALE AI init:",error);

    const history=$("#ai-history");

    if(history)
      history.innerHTML=`
        <div class="empty">
          No se pudo cargar el historial.
          <br><br>
          ${esc(error.message||"Error desconocido")}
        </div>`;

  }finally{

    aiLoading=false;
  }
}

async function loadAIConversations(){

  const {data,error}=
    await sb
      .from("ai_conversations")
      .select("*")
      .order(
        "updated_at",
        {
          ascending:false
        }
      );

  if(error)
    throw error;

  aiConversations=data||[];

  renderAIHistory();

  if(!aiConversations.length){

    await createAIConversation();

  }else{

    if(
      !aiConversationId||
      !aiConversations.some(
        x=>x.id===aiConversationId
      )
    ){

      aiConversationId=
        aiConversations[0].id;
    }

    await loadAIMessages(
      aiConversationId
    );
  }
}

async function createAIConversation(){

  if(!currentUser||!sb)
    return null;

  const {data,error}=
    await sb
      .from("ai_conversations")
      .insert({
        user_id:currentUser.id,
        title:"Nueva conversación"
      })
      .select()
      .single();

  if(error)
    throw error;

  aiConversations.unshift(data);

  aiConversationId=data.id;

  aiMessages=[];

  renderAIHistory();
  renderAIMessages();

  updateAITitle();

  return data;
}

async function editAIConversationTitle(id){

  if(
    !id||
    !currentUser||
    !sb||
    aiLoading
  )
    return;

  const conversation=
    aiConversations.find(
      c=>c.id===id
    );

  if(!conversation)
    return;

  const currentTitle=
    conversation.title||
    "Nueva conversación";

  const newTitle=
    prompt(
      "Nombre de la conversación:",
      currentTitle
    );

  if(newTitle===null)
    return;

  const title=
    newTitle
      .replace(/\s+/g," ")
      .trim();

  if(!title){

    toast(
      "El nombre no puede estar vacío."
    );

    return;
  }

  if(title.length>80){

    toast(
      "El nombre puede tener máximo 80 caracteres."
    );

    return;
  }

  try{

    aiLoading=true;

    const {error}=
      await sb
        .from("ai_conversations")
        .update({
          title,
          updated_at:new Date().toISOString()
        })
        .eq("id",id)
        .eq("user_id",currentUser.id);

    if(error)
      throw error;

    conversation.title=title;

    conversation.updated_at=
      new Date().toISOString();

    renderAIHistory();

    if(aiConversationId===id)
      updateAITitle();

    toast(
      "Nombre de conversación actualizado."
    );

  }catch(error){

    console.error(
      "Error actualizando título:",
      error
    );

    toast(
      "No se pudo cambiar el nombre: "+
      error.message
    );

  }finally{

    aiLoading=false;
  }
}


function makeAITitle(text){

  let clean=
    String(text||"")
      .replace(/\s+/g," ")
      .trim();

  if(!clean)
    return "Nueva conversación";

  clean=
    clean
      .replace(
        /^(hola|hey|oye|buenas|buenos días|buenas tardes|buenas noches)[,!.\s]*/i,
        ""
      )
      .trim();

  clean=
    clean
      .replace(
        /^(ale ai|ale)[,!.\s]*/i,
        ""
      )
      .trim();

  if(!clean)
    return "Nueva conversación";

  clean=
    clean
      .replace(/[¿?¡!]/g,"")
      .trim();

  if(clean.length>55){

    const words=
      clean
        .split(/\s+/);

    let result="";

    for(const word of words){

      if(
        (result+" "+word)
          .trim()
          .length>52
      )
        break;

      result=
        (result+" "+word)
          .trim();
    }

    clean=
      result||
      clean.slice(0,52);
  }

  clean=
    clean.charAt(0).toUpperCase()+
    clean.slice(1);

  return clean;
}

async function editAIConversationTitle(id){

  if(
    !id||
    !currentUser||
    !sb||
    aiLoading
  )
    return;

  const conversation=
    aiConversations.find(
      c=>c.id===id
    );

  if(!conversation)
    return;

  const currentTitle=
    conversation.title||
    "Nueva conversación";

  const newTitle=
    prompt(
      "Nombre de la conversación:",
      currentTitle
    );

  if(newTitle===null)
    return;

  const title=
    newTitle
      .replace(/\s+/g," ")
      .trim();

  if(!title){

    toast(
      "El nombre no puede estar vacío."
    );

    return;
  }

  if(title.length>80){

    toast(
      "El nombre puede tener máximo 80 caracteres."
    );

    return;
  }

  try{

    aiLoading=true;

    const {error}=
      await sb
        .from("ai_conversations")
        .update({
          title,
          updated_at:new Date().toISOString()
        })
        .eq("id",id)
        .eq("user_id",currentUser.id);

    if(error)
      throw error;

    conversation.title=title;

    conversation.updated_at=
      new Date().toISOString();

    renderAIHistory();

    if(aiConversationId===id)
      updateAITitle();

    toast(
      "Nombre de conversación actualizado."
    );

  }catch(error){

    console.error(
      "Error actualizando título:",
      error
    );

    toast(
      "No se pudo cambiar el nombre: "+
      error.message
    );

  }finally{

    aiLoading=false;
  }
}
function makeAITitle(text){

  let clean=
    String(text||"")
      .replace(/\s+/g," ")
      .trim();

  if(!clean)
    return "Nueva conversación";

  clean=
    clean
      .replace(
        /^(hola|hey|oye|buenas|buenos días|buenas tardes|buenas noches)[,!.\s]*/i,
        ""
      )
      .trim();

  clean=
    clean
      .replace(
        /^(ale ai|ale)[,!.\s]*/i,
        ""
      )
      .trim();

  if(!clean)
    return "Nueva conversación";

  clean=
    clean
      .replace(/[¿?¡!]/g,"")
      .trim();

  if(clean.length>55){

    const words=
      clean
        .split(/\s+/);

    let result="";

    for(const word of words){

      if(
        (result+" "+word)
          .trim()
          .length>52
      )
        break;

      result=
        (result+" "+word)
          .trim();
    }

    clean=
      result||
      clean.slice(0,52);
  }

  clean=
    clean.charAt(0).toUpperCase()+
    clean.slice(1);

  return clean;
}

  updateAITitle();
}

async function sendAI(){

  if(
    aiLoading||
    !currentUser||
    !sb
  )
    return;

  const input=$("#aiq");

  if(!input)
    return;

  const text=input.value.trim();

  if(!text)
    return;

  try{

    aiLoading=true;

    const sendButton=$("#ai-send");

    if(sendButton){

      sendButton.disabled=true;
      sendButton.textContent="…";
    }

    if(!aiConversationId){

      await createAIConversation();
    }

    const conversationId=
      aiConversationId;

    const isFirstMessage=
      aiMessages.length===0;

    /* Guardamos el mensaje del usuario */

    const {data:userMessage,error:userError}=
      await sb
        .from("ai_messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"user",
          content:text
        })
        .select()
        .single();

    if(userError)
      throw userError;

    aiMessages.push(userMessage);

    renderAIMessages();

    input.value="";
    autoResizeAIInput(input);

    setAIStatus(
      "ALE AI está pensando…"
    );

    /* Historial anterior que enviamos a Gemini */

    const previousMessages=
      aiMessages
        .slice(0,-1)
        .slice(-30)
        .map(m=>({
          role:m.role,
          content:m.content
        }));

    /* Contexto financiero actual */

    const financial_context=
      getAIFinancialContext();

    /* Llamada al Edge Function */

    const {data,error} =
      await sb.functions.invoke(
        "ale-ai",
        {
          body:{
            message:text,
            messages:previousMessages,
            financial_context
          }
        }
      );

    if(error){

      console.error("ALE AI FUNCTION ERROR:",error);

      let detail="";

      try{

        if(error.context){

          const responseBody =
            await error.context.json();

          detail =
            responseBody?.error ||
            responseBody?.message ||
            JSON.stringify(responseBody);

        }

      }catch(e){

        console.error(
          "No se pudo leer el error:",
          e
        );

      }

      throw new Error(
        detail ||
        error.message ||
        "La Edge Function devolvió un error."
      );
    }

    const answer=
      data?.answer||
      data?.text||
      data?.response;

    if(!answer)
      throw new Error(
        "ALE AI no devolvió una respuesta."
      );

    /* Guardamos la respuesta de ALE AI */

    const {data:assistantMessage,error:assistantError}=
      await sb
        .from("ai_messages")
        .insert({
          conversation_id:conversationId,
          user_id:currentUser.id,
          role:"assistant",
          content:String(answer)
        })
        .select()
        .single();

    if(assistantError)
      throw assistantError;

    aiMessages.push(assistantMessage);

    /* Actualizamos fecha de conversación */

    await sb
      .from("ai_conversations")
      .update({
        updated_at:new Date().toISOString()
      })
      .eq("id",conversationId)
      .eq("user_id",currentUser.id);

    if(isFirstMessage){

      await updateAIConversationTitle(
        conversationId,
        text
      );

    }else{

      const c=
        aiConversations.find(
          x=>x.id===conversationId
        );

      if(c)
        c.updated_at=
          new Date().toISOString();

      aiConversations.sort(
        (a,b)=>
          new Date(b.updated_at)-
          new Date(a.updated_at)
      );

      renderAIHistory();
    }

    renderAIMessages();

    setAIStatus(
      "ALE AI está listo para continuar la conversación."
    );

  }catch(error){

    console.error(
      "ALE AI error:",
      error
    );

    const message=
      error?.message||
      "No se pudo conectar con ALE AI.";

    const box=$("#ai-messages");

    if(box){

      box.insertAdjacentHTML(
        "beforeend",
        `
        <div
          class="ai-message assistant">

          <div class="ai-message-name">
            ALE AI
          </div>

          No pude completar la respuesta.
          ${esc(message)}

        </div>`
      );

      box.scrollTop=box.scrollHeight;
    }

    setAIStatus(
      "Ocurrió un problema al conectar con ALE AI."
    );

  }finally{

    aiLoading=false;

    const sendButton=$("#ai-send");

    if(sendButton){

      sendButton.disabled=false;
      sendButton.textContent="Enviar";
    }

    input.focus();
  }
}

async function deleteAIConversation(){

  if(
    !aiConversationId||
    !currentUser||
    !sb
  ){

    toast(
      "No hay una conversación seleccionada."
    );

    return;
  }

  const conversation=
    aiConversations.find(
      c=>c.id===aiConversationId
    );

  const title=
    conversation?.title||
    "esta conversación";

  if(
    !confirm(
      `¿Eliminar "${title}"?\n\nEsta acción eliminará la conversación y sus mensajes.`
    )
  )
    return;

  try{

    aiLoading=true;

    const id=aiConversationId;

    const {error}=
      await sb
        .from("ai_conversations")
        .delete()
        .eq("id",id)
        .eq("user_id",currentUser.id);

    if(error)
      throw error;

    aiConversations=
      aiConversations.filter(
        c=>c.id!==id
      );

    aiConversationId=null;
    aiMessages=[];

    if(aiConversations.length){

      aiConversationId=
        aiConversations[0].id;

      await loadAIMessages(
        aiConversationId
      );

    }else{

      await createAIConversation();
    }

    renderAIHistory();
    renderAIMessages();
    updateAITitle();

    toast(
      "Conversación eliminada"
    );

  }catch(error){

    console.error(error);

    toast(
      "No se pudo eliminar: "+
      error.message
    );

  }finally{

    aiLoading=false;
  }
}

      new Blob(
        [JSON.stringify(state,null,2)],
        {
          type:"application/json"
        }
      )
    );

  a.click()
}

function importData(e){

  let f=e.target.files[0];

  if(!f)
    return;

  let r=new FileReader();

  r.onload=()=>{

    try{

      let x=
        JSON.parse(r.result);

      if(!x.movements||!x.accounts)
        throw Error();

      state=x;

      save();

      toast("Datos importados");

    }catch{

      toast("Archivo inválido")
    }
  };

  r.readAsText(f)
}

/* =========================================================

   ========================================================= */

function openMove(id){

  editing=id||null;

  let m=
    state.movements.find(
      x=>x.id===id
    )
    ||
    {
      type:"expense",
      amount:"",
      date:new Date()
        .toISOString()
        .slice(0,10),
      category:"",
      sub:"",
      description:"",
      account:"",
      method:"",
      tags:"",
      notes:""
    };

  $("#modalbox").innerHTML=`

  <div class="modalhead">

    <h2>
      ${id?"Editar":"Nuevo"} movimiento
    </h2>

    <button
      class="btn"
      onclick="closeModal()">×</button>

  </div>

  <form
    onsubmit="submitMove(event)"
    class="formgrid">

    <div class="field">

      <label>Tipo</label>

      <select
        name="type"
        onchange="toggleTransferFields(this.value)">

        <option
          value="expense"
          ${m.type==="expense"?"selected":""}>
          Gasto
        </option>

        <option
          value="income"
          ${m.type==="income"?"selected":""}>
          Ingreso
        </option>

        <option
          value="transfer"
          ${m.type==="transfer"?"selected":""}>
          Transferencia
        </option>

      </select>

    </div>

    <div class="field">

      <label>Importe</label>

      <input
        name="amount"
        type="number"
        min="0.01"
        step="0.01"
        value="${m.amount}"
        required>

    </div>

    <div class="field">

      <label>Fecha</label>

      <input
        name="date"
        type="date"
        value="${m.date}"
        required>

    </div>

    <div class="field">

      <label>Hora</label>

      <input
        name="time"
        type="time"
        value="${m.time||""}">

    </div>

    <div class="field">

      <label>Categoría</label>

      <input
        name="category"
        value="${esc(m.category)}">

    </div>

    <div class="field">

      <label>Subcategoría</label>

      <input
        name="sub"
        value="${esc(m.sub)}">

    </div>

    <div class="field">

      <label>Cuenta</label>

      <input
        name="account"
        value="${esc(m.account)}">

    </div>

    <div class="field">

      <label>Método de pago</label>

      <input
        name="method"
        value="${esc(m.method)}">

    </div>

    <div
      class="field transfer-only"
      style="display:${m.type==="transfer"?"flex":"none"}">

      <label>Cuenta de destino</label>

      <input
        name="destination"
        value="${esc(m.destination||"")}">

    </div>

    <div class="field full">

      <label>Descripción</label>

      <input
        name="description"
        value="${esc(m.description)}">

    </div>

    <div class="field full">

      <label>Etiquetas</label>

      <input
        name="tags"
        value="${esc(m.tags)}">

    </div>

    <div class="field full">

      <label>Notas</label>

      <textarea
        name="notes">${esc(m.notes)}</textarea>

    </div>

    <div class="full">

      <button
        class="btn"
        type="button"
        onclick="closeModal()">
        Cancelar
      </button>

      <button class="btn primary">
        Guardar
      </button>

    </div>

  </form>`;

  $("#modal").classList.add("open")
}

function toggleTransferFields(type){

  document
    .querySelectorAll(".transfer-only")
    .forEach(
      x=>
        x.style.display=
          type==="transfer"
          ?"flex"
          :"none"
    );
}

function submitMove(e){

  e.preventDefault();

  let f=
    new FormData(e.target);

  let o=
    Object.fromEntries(f);

  o.amount=+o.amount;

  o.id=
    editing||
    crypto.randomUUID();

  if(!o.amount||o.amount<=0)
    return toast(
      "El importe debe ser mayor que $0"
    );

  if(
    o.type==="transfer"&&
    (
      !o.account||
      !o.destination||
      o.account===o.destination
    )
  )
    return toast(
      "Indica cuentas de origen y destino diferentes"
    );

  let i=
    state.movements.findIndex(
      x=>x.id===o.id
    );

  if(i>=0)
    state.movements[i]=o;
  else
    state.movements.push(o);

  closeModal();

  save();

  toast(
    "Movimiento guardado. Dashboard actualizado"
  );
}

function delMove(id){

  if(
    confirm(
      "¿Eliminar este movimiento?"
    )
  ){

    state.movements=
      state.movements.filter(
        m=>m.id!==id
      );

    save();

    toast(
      "Movimiento eliminado"
    )
  }
}

/* =========================================================
   CUENTAS
   ========================================================= */

function openAccount(){

  editing=null;

  $("#modalbox").innerHTML=`

  <div class="modalhead">

    <h2>Nueva cuenta</h2>

    <button
      class="btn"
      onclick="closeModal()">×</button>

  </div>

  <form
    onsubmit="submitAccount(event)"
    class="formgrid">

    <div class="field">

      <label>Nombre</label>

      <input
        name="name"
        required>

    </div>

    <div class="field">

      <label>Tipo</label>

      <select name="type">

        <option>Efectivo</option>
        <option>Cuenta bancaria</option>
        <option>Tarjeta</option>
        <option>Billetera digital</option>
        <option>Personalizada</option>

      </select>

    </div>

    <div class="full">

      <button
        class="btn"
        type="button"
        onclick="closeModal()">
        Cancelar
      </button>

      <button class="btn primary">
        Guardar
      </button>

    </div>

  </form>`;

  $("#modal").classList.add("open")
}

function submitAccount(e){

  e.preventDefault();

  let f=
    Object.fromEntries(
      new FormData(e.target)
    );

  if(
    state.accounts.some(
      a=>
        a.name.toLowerCase()===
        f.name.toLowerCase()
    )
  )
    return toast(
      "Ya existe una cuenta con ese nombre"
    );

  f.id=crypto.randomUUID();

  state.accounts.push(f);

  closeModal();

  save()
}

function delAccount(id){

  if(
    confirm(
      "¿Eliminar cuenta? Los movimientos asociados se conservarán, pero quedarán sin cuenta."
    )
  ){

    let n=
      state.accounts.find(
        a=>a.id===id
      )?.name;

    state.accounts=
      state.accounts.filter(
        a=>a.id!==id
      );

    state.movements.forEach(
      m=>{
        if(m.account===n)
          m.account=""
      }
    );

    save()
  }
}

function closeModal(){

  $("#modal").classList.remove("open")
}

$("#modal").addEventListener(
  "click",
  e=>{
    if(e.target.id==="modal")
      closeModal()
  }
);

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  document.documentElement.dataset.theme=
    state.settings.theme;

  document.documentElement.style.filter=
    state.settings.contrast
    ?"contrast(1.12)"
    :"";

  nav();

  let v={
    dashboard:dashboard,
    movements:movements,
    budgets:budgets,
    goals:goals,
    accounts:accounts,
    wealth:wealth,
    history:history,
    calculator:calculator,
    ai:ai,
    settings:settings
  }[page]||dashboard;

  $("#view").innerHTML=v();

  if(page==="movements")
    renderMovements();

  if(page==="ai")
    setTimeout(
      ()=>initAI(),
      0
    );
}

window.addEventListener(
  "hashchange",
  ()=>{
    page=
      location.hash.slice(1)||
      "dashboard";

    if(currentUser){

      if(page!=="ai")
        aiInitialized=false;

      render()
    }
  }
);

bootAuth();

</script>
