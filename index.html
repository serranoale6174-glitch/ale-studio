<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ALE STUDIO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#080b10;
  --panel:#10151d;
  --panel2:#151c26;
  --text:#f4f7fb;
  --muted:#8993a3;
  --line:#222b38;
  --accent:#1687ff;
  --accent2:#45a5ff;
  --good:#20c77a;
  --bad:#ef5366;
  --warn:#f5b84b;
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--accent);
}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:245px;
  background:#0b0f15;
  border-right:1px solid var(--line);
  padding:18px;
  position:fixed;
  inset:0 auto 0 0;
  overflow:auto;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:25px;
}

.logo span{
  color:var(--accent2);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:12px;
  border-radius:10px;
}

.nav button:hover,
.nav button.active{
  color:var(--text);
  background:#1687ff18;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
  padding:22px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.topbar h1{
  margin:0;
  font-size:26px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.grid{
  display:grid;
  gap:14px;
}

.grid4{
  grid-template-columns:repeat(4,1fr);
}

.grid3{
  grid-template-columns:repeat(3,1fr);
}

.grid2{
  grid-template-columns:repeat(2,1fr);
}

.stat{
  min-height:120px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:12px;
}

.stat-value{
  font-size:27px;
  font-weight:800;
}

.btn{
  padding:10px 14px;
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
}

.btn:hover{
  border-color:#3b4b61;
}

.btn.primary{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.btn.danger{
  background:#d33b5015;
  color:var(--bad);
  border-color:#d33b5028;
}

.btn.good{
  background:#20c77a15;
  color:var(--good);
  border-color:#20c77a28;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:14px;
}

.muted{
  color:var(--muted);
}

.money-positive{
  color:var(--good);
}

.money-negative{
  color:var(--bad);
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}

th{
  color:var(--muted);
  font-size:12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.authgate{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#070a0f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authhide{
  display:none;
}

.authbox{
  width:min(440px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  box-shadow:0 25px 80px #0008;
}

.auth-logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
}

.auth-logo span{
  color:var(--accent2);
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.auth-buttons{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.auth-buttons .btn{
  width:100%;
  padding:13px;
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:var(--panel2);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:10000;
  background:#151c26;
  border:1px solid var(--line);
  color:var(--text);
  padding:12px 15px;
  border-radius:10px;
  box-shadow:0 10px 40px #0008;
  display:none;
}

.toast.show{
  display:block;
}

.form{
  display:grid;
  gap:12px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-item{
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel2);
}

.ai-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:14px;
  height:calc(100vh - 140px);
}

.ai-history{
  display:flex;
  flex-direction:column;
  min-height:0;
}

.ai-history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}

.ai-history-list{
  overflow:auto;
  margin-top:10px;
}

.ai-history-item{
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:5px;
}

.ai-history-item>button:first-child{
  flex:1;
  min-width:0;
  padding:10px;
  border-radius:10px;
  background:transparent;
  color:var(--text);
  text-align:left;
}

.ai-history-item>button:first-child:hover,
.ai-history-item.active>button:first-child{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
}

.ai-history-item strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ai-history-item span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.ai-delete{
  width:30px;
  height:30px;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
}

.ai-delete:hover{
  background:#d33b5012;
  color:var(--bad);
}

.ai-empty{
  padding:20px 10px;
  text-align:center;
  color:var(--muted);
}

.ai-chat-wrap{
  min-width:0;
}

.chat{
  height:100%;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.messages{
  flex:1;
  overflow:auto;
  padding:8px;
}

.msg{
  max-width:80%;
  padding:12px 14px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:10px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.msg.me{
  margin-left:auto;
  background:#1687ff18;
  border-color:#1687ff35;
}

.chatbar{
  display:flex;
  gap:8px;
  padding-top:10px;
  border-top:1px solid var(--line);
}

.chatbar input{
  flex:1;
}

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.hidden{
  display:none!important;
}

@media(max-width:1000px){

  .grid4{
    grid-template-columns:repeat(2,1fr);
  }

  .ai-layout{
    grid-template-columns:230px 1fr;
  }

}

@media(max-width:760px){

  .sidebar{
    width:72px;
    padding:12px 8px;
  }

  .logo{
    font-size:14px;
    text-align:center;
  }

  .nav button{
    text-align:center;
    font-size:0;
  }

  .nav button::first-letter{
    font-size:18px;
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px);
    padding:14px;
  }

  .grid4,
  .grid3,
  .grid2,
  .settings-grid{
    grid-template-columns:1fr;
  }

  .ai-layout{
    grid-template-columns:1fr;
    height:auto;
  }

  .ai-history{
    max-height:220px;
  }

  .chat{
    height:600px;
  }

  .topbar{
    align-items:flex-start;
  }

  .profile{
    display:none;
  }

  .form-row{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div id="authgate" class="authgate">

  <div class="authbox">

    <div class="auth-logo">
      ALE <span>STUDIO</span>
    </div>

    <div class="auth-sub">
      Gestión inteligente de tu capital
    </div>

    <div class="auth-buttons">

      <button
        class="btn primary"
        onclick="loginGoogle()">
        Continuar con Google
      </button>

      <button
        class="btn"
        onclick="loginEmail()">
        Iniciar con correo
      </button>

    </div>

    <div
      id="authmsg"
      class="muted"
      style="margin-top:15px;text-align:center">
    </div>

  </div>

</div>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      ALE <span>STUDIO</span>
    </div>

    <div class="nav" id="nav"></div>

  </aside>

  <main class="main">

    <div id="view"></div>

  </main>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL=
  "https://aqrbpwjvsymhcrwwepjm.supabase.co";

const SUPABASE_PUBLISHABLE_KEY=
  "sb_publishable_yw7_LklXOjEuuz9lEGJF6w_T7yV5ATw";

const AUTH_READY=
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("YOUR_") &&
  SUPABASE_PUBLISHABLE_KEY &&
  !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");

const sb=
  AUTH_READY
  ?window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    )
  :null;

let session=null;
let currentUser=null;


/* =========================================================
   BASE STATE
========================================================= */

const BASE_STATE={

  movements:[],

  budgets:[],

  goals:[],

  accounts:[],

  dashboard:{

    cards:{

      balance:true,
      income:true,
      expense:true,
      wealth:true

    }

  },

  settings:{

    theme:"dark",

    contrast:false

  }

};

let state=
  structuredClone(BASE_STATE);

let page=
  location.hash.slice(1)||
  "dashboard";


/* =========================================================
   AI STATE
========================================================= */

let aiConversationId=null;

let aiConversations=[];


/* =========================================================
   HELPERS
========================================================= */

const $=
  selector=>
  document.querySelector(selector);

function esc(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function money(value){

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(Number(value)||0);

}

function toast(message){

  const el=$("#toast");

  if(!el)
    return;

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(
    el._timer
  );

  el._timer=
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      3000
    );

}

function uid(){

  return crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now().toString(36)+
     Math.random().toString(36).slice(2);

}


/* =========================================================
   FINANCIAL TOTALS
========================================================= */

function totals(){

  let income=0;
  let expense=0;

  for(const m of state.movements){

    const amount=
      Number(m.amount)||0;

    if(m.type==="income")
      income+=amount;

    if(m.type==="expense")
      expense+=amount;

  }

  return{

    income,

    expense,

    balance:
      income-expense

  };

}


/* =========================================================
   HEADER
========================================================= */

function header(title){

  return`

    <div class="topbar">

      <div>

        <h1>${esc(title)}</h1>

      </div>

      <div class="profile">

        ${
          currentUser?.user_metadata?.avatar_url
          ?
          `<img
             class="avatar"
             src="${esc(
               currentUser.user_metadata.avatar_url
             )}">`
          :
          `<div class="avatar"></div>`
        }

        <div>

          <strong>
            ${esc(
              currentUser?.user_metadata?.full_name||
              currentUser?.email||
              "Usuario"
            )}
          </strong>

          <div class="muted">
            Cuenta privada
          </div>

        </div>

        <button
          class="btn"
          onclick="logout()">
          Salir
        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   NAVIGATION
========================================================= */

function nav(){

  const items=[

    ["dashboard","🏠 Dashboard"],

    ["movements","↕ Movimientos"],

    ["budgets","◫ Presupuestos"],

    ["goals","◎ Metas"],

    ["accounts","▣ Cuentas"],

    ["wealth","◆ Patrimonio"],

    ["history","◷ Historial"],

    ["calculator","⌘ Calculadora"],

    ["ai","✦ ALE AI"],

    ["settings","⚙ Configuración"]

  ];

  $("#nav").innerHTML=
    items
      .map(
        ([id,label])=>
        `<button
          class="${page===id?"active":""}"
          onclick="go('${id}')">
          ${label}
        </button>`
      )
      .join("");

}


/* =========================================================
   DASHBOARD
========================================================= */

function dashboard(){

  const t=totals();

  return`

    ${header("Dashboard")}

    <div class="grid grid4">

      ${
        state.dashboard.cards.balance
        ?
        `
        <div class="card stat">

          <div class="stat-label">
            Capital
          </div>

          <div class="stat-value">
            ${money(t.balance)}
          </div>

        </div>
        `
        :""
      }

      ${
        state.dashboard.cards.wealth
        ?
        `
        <div class="card stat">

          <div class="stat-label">
            Patrimonio Líquido
          </div>

          <div class="stat-value">
            ${money(t.balance)}
          </div>

        </div>
        `
        :""
      }

      ${
        state.dashboard.cards.income
        ?
        `
        <div class="card stat">

          <div class="stat-label">
            Ingresos
          </div>

          <div class="stat-value money-positive">
            ${money(t.income)}
          </div>

        </div>
        `
        :""
      }

      ${
        state.dashboard.cards.expense
        ?
        `
        <div class="card stat">

          <div class="stat-label">
            Flujo de salida
          </div>

          <div class="stat-value money-negative">
            ${money(t.expense)}
          </div>

        </div>
        `
        :""
      }

    </div>

    <div
      class="grid grid2"
      style="margin-top:14px">

      <div class="card">

        <div class="section-title">
          Resumen financiero
        </div>

        <div class="list">

          <div class="list-item">

            <div class="muted">
              Capital disponible
            </div>

            <strong>
              ${money(t.balance)}
            </strong>

          </div>

          <div class="list-item">

            <div class="muted">
              Ingresos registrados
            </div>

            <strong class="money-positive">
              ${money(t.income)}
            </strong>

          </div>

          <div class="list-item">

            <div class="muted">
              Flujo de salida
            </div>

            <strong class="money-negative">
              ${money(t.expense)}
            </strong>

          </div>

        </div>

      </div>

      <div class="card">

        <div class="section-title">
          Acciones rápidas
        </div>

        <div class="actions">

          <button
            class="btn primary"
            onclick="go('movements')">
            Registrar movimiento
          </button>

          <button
            class="btn"
            onclick="go('budgets')">
            Presupuestos
          </button>

          <button
            class="btn"
            onclick="go('goals')">
            Metas
          </button>

          <button
            class="btn"
            onclick="go('ai')">
            Abrir ALE AI
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   MOVEMENTS
========================================================= */

function movements(){

  return`

    ${header("Movimientos")}

    <div
      class="grid grid2">

      <div class="card">

        <div class="section-title">
          Registrar movimiento
        </div>

        <div class="form">

          <div>

            <label class="muted">
              Tipo
            </label>

            <select id="movementType">

              <option value="income">
                Ingreso
              </option>

              <option value="expense">
                Gasto
              </option>

            </select>

          </div>

          <div>

            <label class="muted">
              Monto
            </label>

            <input
              id="movementAmount"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00">

          </div>

          <div>

            <label class="muted">
              Descripción
            </label>

            <input
              id="movementDescription"
              placeholder="Ej. Salario">

          </div>

          <button
            class="btn primary"
            onclick="addMovement()">
            Guardar movimiento
          </button>

        </div>

      </div>

      <div class="card">

        <div class="section-title">
          Resumen
        </div>

        <div id="movementSummary"></div>

      </div>

    </div>

    <div
      class="card"
      style="margin-top:14px">

      <div class="section-title">
        Movimientos registrados
      </div>

      <div
        class="table-wrap"
        id="movementTable"></div>

    </div>

  `;

}

function renderMovements(){

  const t=totals();

  $("#movementSummary").innerHTML=`

    <div class="list">

      <div class="list-item">

        <span class="muted">
          Ingresos
        </span>

        <strong class="money-positive">
          ${money(t.income)}
        </strong>

      </div>

      <div class="list-item">

        <span class="muted">
          Gastos
        </span>

        <strong class="money-negative">
          ${money(t.expense)}
        </strong>

      </div>

      <div class="list-item">

        <span class="muted">
          Capital / Patrimonio Líquido
        </span>

        <strong>
          ${money(t.balance)}
        </strong>

      </div>

    </div>

  `;

  if(!state.movements.length){

    $("#movementTable").innerHTML=
      `<div class="empty">
        Todavía no tienes movimientos.
      </div>`;

    return;

  }

  $("#movementTable").innerHTML=`

    <table>

      <thead>

        <tr>

          <th>Tipo</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Fecha</th>
          <th></th>

        </tr>

      </thead>

      <tbody>

        ${
          state.movements
            .slice()
            .reverse()
            .map(
              m=>`

              <tr>

                <td>
                  ${
                    m.type==="income"
                    ?"Ingreso"
                    :"Gasto"
                  }
                </td>

                <td>
                  ${esc(m.description||"Sin descripción")}
                </td>

                <td class="${
                  m.type==="income"
                  ?"money-positive"
                  :"money-negative"
                }">

                  ${
                    m.type==="income"
                    ?"+"
                    :"-"
                  }${money(m.amount)}

                </td>

                <td>
                  ${new Date(m.created_at).toLocaleString()}
                </td>

                <td>

                  <button
                    class="btn danger"
                    onclick="deleteMovement('${m.id}')">
                    Eliminar
                  </button>

                </td>

              </tr>

              `
            )
            .join("")
        }

      </tbody>

    </table>

  `;

}

async function addMovement(){

  const type=
    $("#movementType")?.value;

  const amount=
    Number(
      $("#movementAmount")?.value
    );

  const description=
    $("#movementDescription")?.value
      .trim();

  if(!amount||amount<=0){

    toast("Introduce un monto válido");

    return;

  }

  state.movements.push({

    id:uid(),

    type,

    amount,

    description,

    created_at:
      new Date().toISOString()

  });

  await save();

  if(page==="movements")
    renderMovements();

  toast("Movimiento guardado");

}

async function deleteMovement(id){

  state.movements=
    state.movements.filter(
      m=>m.id!==id
    );

  await save();

  if(page==="movements")
    renderMovements();

  toast("Movimiento eliminado");

}


/* =========================================================
   BUDGETS
========================================================= */

function budgets(){

  return`

/* =========================================================
   CALCULATOR
========================================================= */

function calculator(){

  return`

    ${header("Calculadora")}

    <div class="card">

      <div class="form">

        <input
          id="calcA"
          type="number"
          placeholder="Primer número">

        <select id="calcOp">

          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>

        </select>

        <input
          id="calcB"
          type="number"
          placeholder="Segundo número">

        <button
          class="btn primary"
          onclick="calculate()">
          Calcular
        </button>

        <div
          id="calcResult"
          class="stat-value">
        </div>

      </div>

    </div>

  `;

}

function calculate(){

  const a=
    Number($("#calcA").value);

  const b=
    Number($("#calcB").value);

  const op=
    $("#calcOp").value;

  let result=0;

  if(op==="+")
    result=a+b;

  if(op==="-")
    result=a-b;

  if(op==="*")
    result=a*b;

  if(op==="/")
    result=
      b===0
      ?"No se puede dividir entre cero"
      :a/b;

  $("#calcResult").textContent=
    typeof result==="number"
    ?result
    :result;

}


/* =========================================================
   AI — CONVERSATIONS
========================================================= */

async function loadAIConversations(){

  if(!sb||!currentUser){

    aiConversations=[];

    return;

  }

  const {data,error}=
    await sb
      .from("ai_conversations")
      .select(
        "id,title,created_at,updated_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "updated_at",
        {
          ascending:false
        }
      );

  if(error){

    toast(
      "No se pudo cargar el historial de ALE AI: "+
      error.message
    );

    return;

  }

  aiConversations=data||[];

  if(
    aiConversationId&&
    !aiConversations.some(
      c=>c.id===aiConversationId
    )
  ){

    aiConversationId=null;

  }

  if(
    !aiConversationId&&
    aiConversations.length
  ){

    aiConversationId=
      aiConversations[0].id;

  }

}


async function createAIConversation(
  title="Nueva conversación"
){

  if(!sb||!currentUser)
    return null;

  const {data,error}=
    await sb
      .from("ai_conversations")
      .insert({

        user_id:
          currentUser.id,

        title:
          title||
          "Nueva conversación"

      })
      .select()
      .single();

  if(error){

    toast(
      "No se pudo crear la conversación: "+
      error.message
    );

    return null;

  }

  aiConversations.unshift(data);

  aiConversationId=data.id;

  return data;

}


async function loadAIMessages(
  conversationId
){

  if(
    !sb||
    !currentUser||
    !conversationId
  )
    return [];

  const {data,error}=
    await sb
      .from("ai_messages")
      .select(
        "id,role,content,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    toast(
      "No se pudieron cargar los mensajes: "+
      error.message
    );

    return [];

  }

  return data||[];

}


async function saveAIMessage(
  conversationId,
  role,
  content
){

  if(
    !sb||
    !currentUser||
    !conversationId
  )
    return false;

  const {error}=
    await sb
      .from("ai_messages")
      .insert({

        conversation_id:
          conversationId,

        user_id:
          currentUser.id,

        role,

        content

      });

  if(error){

    toast(
      "No se pudo guardar el mensaje: "+
      error.message
    );

    return false;

  }

  const {error:updateError}=
    await sb
      .from("ai_conversations")
      .update({

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        conversationId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if(updateError){

    toast(
      "No se pudo actualizar la conversación: "+
      updateError.message
    );

    return false;

  }

  return true;

}


async function deleteAIConversation(id){

  if(
    !sb||
    !currentUser||
    !id
  )
    return;

  if(
    !confirm(
      "¿Eliminar esta conversación y todos sus mensajes?"
    )
  )
    return;

  const {error}=
    await sb
      .from("ai_conversations")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if(error){

    toast(
      "No se pudo eliminar la conversación: "+
      error.message
    );

    return;

  }

  aiConversations=
    aiConversations.filter(
      c=>c.id!==id
    );

  if(aiConversationId===id){

    aiConversationId=
      aiConversations[0]?.id||null;

  }

  render();

  if(aiConversationId)
    await renderAIMessages();

}


async function startNewAIConversation(){

  const c=
    await createAIConversation(
      "Nueva conversación"
    );

  if(!c)
    return;

  render();

  await renderAIMessages();

}


async function openAIConversation(id){

  if(!id)
    return;

  aiConversationId=id;

  render();

  await renderAIMessages();

}


/* =========================================================
   AI MESSAGES
========================================================= */

async function renderAIMessages(){

  const box=$("#messages");

  if(!box)
    return;

  if(!aiConversationId){

    box.innerHTML=`

      <div class="msg">

        <b>ALE AI</b><br>

        Hola. Soy ALE AI.
        ¿En qué puedo ayudarte?

      </div>

    `;

    return;

  }

  const messages=
    await loadAIMessages(
      aiConversationId
    );

  if(!messages.length){

    box.innerHTML=`

      <div class="msg">

        <b>ALE AI</b><br>

        Hola. Soy ALE AI.
        ¿En qué puedo ayudarte?

      </div>

    `;

    return;

  }

  box.innerHTML=
    messages
      .map(
        m=>`

        <div
          class="msg ${m.role==="user"?"me":""}">

          ${
            m.role==="assistant"
            ?"<b>ALE AI</b><br>"
            :""
          }

          ${esc(m.content)}

        </div>

        `
      )
      .join("");

  box.scrollTop=
    box.scrollHeight;

}


/* =========================================================
   AI — REAL BACKEND PLACEHOLDER
========================================================= */

/*
  IMPORTANTE:

  Aquí ya NO existe la antigua respuesta:

  "Capital/Patrimonio Líquido $10.00..."

  ALE AI ya no genera respuestas automáticas
  basadas únicamente en totals().

  El siguiente paso es conectar esta función
  con tu Edge Function segura.

  El frontend nunca debe contener la API KEY
  del proveedor de inteligencia artificial.
*/

async function askAI(){

  const input=$("#aiq");

  if(!input)
    return;

  const q=
    input.value.trim();

  if(!q)
    return;

  if(!currentUser){

    toast("Debes iniciar sesión");

    return;

  }

  /*
    Crear conversación automáticamente.
  */

  if(!aiConversationId){

    const title=
      q.length>40
      ?q.slice(0,40)+"…"
      :q;

    const c=
      await createAIConversation(title);

    if(!c)
      return;

  }

  input.value="";

  /*
    Guardar mensaje del usuario.
  */

  const userSaved=
    await saveAIMessage(
      aiConversationId,
      "user",
      q
    );

  if(!userSaved)
    return;

  /*
    =======================================================
    PUNTO DE CONEXIÓN DEL MOTOR REAL DE ALE AI
    =======================================================

    NO ponemos ninguna API KEY aquí.

    El frontend deberá llamar a:

      Supabase Edge Function

    y esa función será la responsable de comunicarse
    con el proveedor de IA usando un secreto almacenado
    en Supabase.

    Por ahora mostramos un mensaje de estado en lugar
    de inventar una respuesta.
  */

  const ans=
    "Mensaje recibido. ALE AI ya está guardando esta conversación de forma privada en tu cuenta. El motor de inteligencia artificial se conectará mediante el backend seguro de ALE STUDIO.";

  const assistantSaved=
    await saveAIMessage(
      aiConversationId,
      "assistant",
      ans
    );

  if(!assistantSaved)
    return;

  await loadAIConversations();

  render();

  await renderAIMessages();

  setTimeout(
    ()=>{
      $("#aiq")?.focus();
    },
    50
  );

}

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "ale-studio-backup.json";

  a.click();

  URL.revokeObjectURL(url);

}

/* =========================================================
   WORKSPACE CLOUD
========================================================= */

async function loadWorkspace(){

  state=
    structuredClone(BASE_STATE);

  if(sb&&currentUser){

    const {data,error}=
      await sb
        .from("workspaces")
        .select("data")
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

    if(error){

      toast(
        "No se pudo cargar tu workspace: "+
        error.message
      );

      return;

    }

    if(data?.data){

      state=
        Object.assign(
          structuredClone(BASE_STATE),
          data.data
        );

    }

    state.dashboard=
      Object.assign(
        structuredClone(BASE_STATE.dashboard),
        state.dashboard||{}
      );

    state.dashboard.cards=
      Object.assign(
        structuredClone(
          BASE_STATE.dashboard.cards
        ),
        state.dashboard.cards||{}
      );

    state.movements=
      Array.isArray(state.movements)
      ?state.movements
      :[];

    state.budgets=
      Array.isArray(state.budgets)
      ?state.budgets
      :[];

    state.goals=
      Array.isArray(state.goals)
      ?state.goals
      :[];

    state.accounts=
      Array.isArray(state.accounts)
      ?state.accounts
      :[];

  }

}


async function save(){

  if(!currentUser)
    return;

  if(sb){

    const {error}=
      await sb
        .from("workspaces")
        .upsert(
          {
            user_id:
              currentUser.id,

            data:
              state,

            updated_at:
              new Date().toISOString()

          },
          {
            onConflict:
              "user_id"
          }
        );

    if(error){

      toast(
        "No se pudo guardar: "+
        error.message
      );

      return;

    }

  }

  render();

}


/* =========================================================
   AUTH
========================================================= */

async function loginGoogle(){

  if(!sb){

    toast(
      "Supabase no está configurado."
    );

    return;

  }

  const {error}=
    await sb.auth.signInWithOAuth({

      provider:"google",

      options:{

        redirectTo:
          location.origin+
          location.pathname

      }

    });

  if(error){

    toast(
      "Error al iniciar con Google: "+
      error.message
    );

  }

}


async function loginEmail(){

  if(!sb){

    toast(
      "Supabase no está configurado."
    );

    return;

  }

  const email=
    prompt(
      "Introduce tu correo electrónico:"
    );

  if(!email)
    return;

  const password=
    prompt(
      "Introduce tu contraseña:"
    );

  if(!password)
    return;

  const {data,error}=
    await sb.auth.signInWithPassword({

      email,
      password

    });

  if(error){

    /*
      Si la cuenta todavía no existe,
      intentamos crearla.
    */

    const created=
      await sb.auth.signUp({

        email,
        password

      });

    if(created.error){

      toast(
        "No se pudo iniciar sesión: "+
        error.message
      );

      return;

    }

    toast(
      "Cuenta creada. Revisa tu correo si Supabase solicita confirmación."
    );

    return;

  }

  if(data.session)
    await onSignedIn(data.session);

}


async function onSignedIn(s){

  session=s;

  currentUser=s.user;

  await loadWorkspace();

  await loadAIConversations();

  $("#authgate")
    .classList
    .add("authhide");

  render();

  if(page==="ai"){

    await renderAIMessages();

  }

}


async function logout(){

  if(sb)
    await sb.auth.signOut();

  session=null;

  currentUser=null;

  aiConversationId=null;

  aiConversations=[];

  state=
    structuredClone(BASE_STATE);

  page="dashboard";

  location.hash="dashboard";

  $("#authgate")
    .classList
    .remove("authhide");

  authUI();

}


function authUI(){

  const msg=$("#authmsg");

  if(msg){

    msg.textContent=
      AUTH_READY
      ?"Inicia sesión para acceder a ALE STUDIO."
      :"Supabase no está configurado.";

  }

}


/* =========================================================
   BOOT AUTH
========================================================= */

async function bootAuth(){

  if(!AUTH_READY){

    authUI();

    return;

  }

  const {data}=
    await sb.auth.getSession();

  if(data.session){

    await onSignedIn(
      data.session
    );

  }else{

    authUI();

  }

  sb.auth.onAuthStateChange(
    async(
      _event,
      s
    )=>{

      if(
        s&&
        !currentUser
      ){

        await onSignedIn(s);

      }

    }
  );

}


/* =========================================================
   ROUTING
========================================================= */

async function go(p){

  page=p;

  location.hash=p;

  if(p==="ai"){

    await loadAIConversations();

    if(
      !aiConversationId&&
      aiConversations.length
    ){

      aiConversationId=
        aiConversations[0].id;

    }

    render();

    if(aiConversationId)
      await renderAIMessages();

    return;

  }

  render();

}


function render(){

  if(!currentUser)
    return;

  document.documentElement.dataset.theme=
    state.settings.theme;

  document.documentElement.style.filter=
    state.settings.contrast
    ?"contrast(1.12)"
    :"";

  nav();

  const views={

    dashboard,

    movements,

    budgets,

    goals,

    accounts,

    wealth,

    history,

    calculator,

    ai,

    settings

  };

  const view=
    views[page]||
    dashboard;

  $("#view").innerHTML=
    view();

  if(page==="movements")
    renderMovements();

}


/* =========================================================
   HASH CHANGE
========================================================= */

window.addEventListener(
  "hashchange",
  async()=>{

    page=
      location.hash.slice(1)||
      "dashboard";

    if(currentUser){

      if(page==="ai"){

        await loadAIConversations();

        if(
          !aiConversationId&&
          aiConversations.length
        ){

          aiConversationId=
            aiConversations[0].id;

        }

        render();

        await renderAIMessages();

      }else{

        render();

      }

    }

  }
);


/* =========================================================
   START
========================================================= */

bootAuth();

</script>

</body>
</html>
