<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALE STUDIO — Finanzas personales</title>
<link rel="icon" type="image/png" href="logo-as.png">

<style>
:root{
  --bg:#f5f7fb;
  --panel:#fff;
  --text:#101522;
  --muted:#697386;
  --line:#e5e9f1;
  --accent:#635bff;
  --accent2:#8b5cf6;
  --good:#149447;
  --bad:#d33b50;
  --shadow:0 12px 35px #17255412
}

[data-theme=dark]{
  --bg:#0b0e15;
  --panel:#121722;
  --text:#f5f7fb;
  --muted:#9aa5b5;
  --line:#252d3c;
  --shadow:0 12px 35px #0008
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 80% -10%,#8b5cf61a,transparent 35%),var(--bg);
  color:var(--text);
  font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{display:flex;min-height:100vh}

.side{
  width:245px;
  padding:22px 16px;
  border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  position:sticky;
  top:0;
  height:100vh
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:.08em;
  margin:4px 10px 25px
}

.brand span{color:var(--accent)}

nav button{
  width:100%;
  padding:12px 13px;
  margin:3px 0;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  text-align:left
}

nav button.active,
nav button:hover{
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  color:var(--text)
}

.main{
  flex:1;
  padding:26px;
  max-width:1500px;
  margin:auto;
  width:100%
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}

.top h1{
  margin:0;
  font-size:28px
}

.actions{
  display:flex;
  gap:8px
}

.btn{
  padding:10px 14px;
  border-radius:11px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text)
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:0;
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow)
}

.label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em
}

.value{
  font-size:27px;
  font-weight:850;
  margin-top:8px;
  letter-spacing:-.02em
}

.card[onclick]:hover .value{
  transform:translateY(-1px)
}

.sub{
  color:var(--muted);
  font-size:12px;
  margin-top:5px
}

.two{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:14px;
  margin-top:14px
}

.section{margin-top:20px}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:700
}

.field input,
.field select,
.field textarea{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  outline:none
}

.tablewrap{overflow:auto}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  padding:12px 9px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap
}

.table th{
  color:var(--muted);
  font-size:12px
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted)
}

.pill{
  padding:5px 8px;
  border-radius:99px;
  background:#635bff18;
  color:var(--accent);
  font-weight:700;
  font-size:11px
}

.danger{color:var(--bad)}
.good{color:var(--good)}

.progress{
  height:8px;
  background:var(--line);
  border-radius:99px;
  overflow:hidden;
  margin-top:10px
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2))
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10
}

.modal.open{display:flex}

.modalbox{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--panel);
  border-radius:20px;
  padding:20px
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.full{grid-column:1/-1}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px
}

.modalhead h2{margin:0}

.chart{
  height:230px;
  position:relative
}

.chart svg{
  width:100%;
  height:100%
}

.legend{
  display:flex;
  gap:15px;
  color:var(--muted);
  font-size:12px
}

.fab{
  position:fixed;
  right:24px;
  bottom:24px;
  border-radius:99px;
  padding:14px 18px;
  box-shadow:var(--shadow)
}

.chat{
  display:grid;
  grid-template-rows:1fr auto;
  height:calc(100vh - 140px);
  max-width:850px
}

.messages{
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:8px
}

.msg{
  max-width:80%;
  padding:12px 14px;
  border-radius:15px;
  background:var(--line);
  white-space:pre-wrap;
  line-height:1.5
}

.msg.me{
  align-self:flex-end;
  background:var(--accent);
  color:white
}

.chatbar{
  display:flex;
  gap:8px;
  margin-top:10px
}

.chatbar input{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text)
}

.settings{max-width:700px}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  display:none;
  z-index:30
}

.toast.show{display:block}

/* =========================================================
   ALE AI — NUEVA INTERFAZ
   ========================================================= */

.ai-layout{
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:14px;
  height:calc(100vh - 140px);
  min-height:500px
}

.ai-sidebar{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden
}

.ai-sidebar-head{
  padding:14px;
  border-bottom:1px solid var(--line)
}

.ai-sidebar-title{
  font-size:13px;
  font-weight:850;
  margin-bottom:10px
}

.ai-new{
  width:100%
}

.ai-history{
  overflow:auto;
  padding:8px
}

.ai-conversation{
